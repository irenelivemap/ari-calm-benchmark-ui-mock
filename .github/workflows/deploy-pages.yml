name: Deploy participant site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install browser for Calm end-to-end tests
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Run Calm end-to-end tests
        run: npm run test:e2e

      - name: Build static participant site
        env:
          ARI_GOOGLE_MAPS_KEY: ${{ secrets.ARI_GOOGLE_MAPS_KEY }}
          ARI_MAPTILER_KEY: ${{ secrets.ARI_MAPTILER_KEY }}
        run: node scripts/build-pages.mjs --out _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000
